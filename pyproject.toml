[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-nova"
version = "1.0.0"
description = "Autonomous Multi-Agent Cybersecurity Incident Response & Threat Hunting Mesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cyber-Nova Core Engineering" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "tornado>=6.0",
]

[project.scripts]
cyber-nova = "cyber_nova.cli:main"
